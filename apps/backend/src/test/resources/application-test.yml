spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: false

# Cal.com Integration - Test Configuration
calcom:
  api:
    url: http://localhost:3000/api/v2
    key: test-api-key
  webhook:
    secret: test-webhook-secret

# JWT Configuration - Test Configuration
jwt:
  secret: test-secret-key-which-is-at-least-32-bytes-long
  expiration: 86400000

# Application Security - Test Configuration
app:
  security:
    jwt:
      secret: test-secret-key-which-is-at-least-32-bytes-long
      expiration: 86400000
    auth:
      username: test-admin
      password: test-admin-123
      roles: ADMIN,STAFF
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001
  notifications:
    enabled: false
  analytics:
    scheduled-reports:
      enabled: false
    refresh-views:
      enabled: false
  availability:
    enforced: false
    sync:
      enabled: false
