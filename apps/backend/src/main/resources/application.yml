spring:
  application:
    name: backend
  profiles:
    active: dev

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/citamedica
    username: citamedica
    password: citamedica123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  actuator:
    health:
      db:
        enabled: true

---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  actuator:
    health:
      db:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Cal.com Integration
calcom:
  api:
    url: http://localhost:3000/api/v2
    key: ${CALCOM_API_KEY}
  webhook:
    secret: ${CALCOM_WEBHOOK_SECRET}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dev-secret-key}
  expiration: ${JWT_EXPIRATION:86400000}
