spring:
  application:
    name: citamedica-backend
  profiles:
    active: dev

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/citamedica}
    username: ${SPRING_DATASOURCE_USERNAME:citamedica}
    password: ${SPRING_DATASOURCE_PASSWORD:citamedica123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m
  actuator:
    health:
      db:
        enabled: true

---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  actuator:
    health:
      db:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:dev}
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Cal.com Integration
calcom:
  api:
    url: ${CALCOM_API_URL:http://localhost:3000/api/v2}
    key: ${CALCOM_API_KEY:}
  webhook:
    secret: ${CALCOM_WEBHOOK_SECRET:dev-webhook-secret-change-in-production}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

# Application Security
app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-key-change-in-production}
      expiration: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
    sendgrid:
      api-key: ${SENDGRID_API_KEY:}
      api-url: ${SENDGRID_API_URL:https://api.sendgrid.com}
      from: ${NOTIFICATIONS_FROM_EMAIL:no-reply@citamedica.com}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      api-url: ${TWILIO_API_URL:https://api.twilio.com}
      from: ${NOTIFICATIONS_FROM_SMS:CitaMedica}
    retry:
      max-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
      initial-delay-seconds: ${NOTIFICATION_RETRY_INITIAL_DELAY_SECONDS:60}
  availability:
    enforced: ${AVAILABILITY_ENFORCED:true}
    slot-generation:
      cron: "0 0 3 * * *"
      horizon-days: 90
      batch-size: 100
      max-duration-alert-ms: 300000
    sync:
      enabled: true
      fixed-delay-ms: 21600000
  payment:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
    reconciliation:
      enabled: ${PAYMENT_RECONCILIATION_ENABLED:false}
      cron: "0 0 2 * * *"
  analytics:
    scheduled-reports:
      enabled: ${ANALYTICS_SCHEDULED_REPORTS_ENABLED:true}
      cron: "0 0 6 * * *"
    refresh-views:
      enabled: ${ANALYTICS_REFRESH_VIEWS_ENABLED:false}
      cron: "0 0 1 * * *"

# Logging configuration
logging:
  level:
    root: INFO
    com.citamedica: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{correlationId}] %msg%n"

# Server configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false
