services:
  # PostgreSQL for CitaMedica Backend (optional: use profile docker-db, or Postgres nativo en DEV)
  postgres-clinic:
    profiles:
      - docker-db
    image: postgres:16-alpine
    container_name: citamedica-postgres
    environment:
      POSTGRES_DB: citamedica
      POSTGRES_USER: citamedica
      POSTGRES_PASSWORD: citamedica123
    ports:
      - "5432:5432"
    volumes:
      - postgres-clinic-data:/var/lib/postgresql/data
    networks:
      - citamedica-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citamedica"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Spring Boot) — solo con perfil docker-db; en DEV local usar make backend-local
  backend-api:
    profiles:
      - docker-db
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: citamedica-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-clinic:5432/citamedica
      SPRING_DATASOURCE_USERNAME: citamedica
      SPRING_DATASOURCE_PASSWORD: citamedica123
      CALCOM_API_URL: http://calcom:3000/api/v2
      CALCOM_API_KEY: ${CALCOM_API_KEY:-}
      CALCOM_WEBHOOK_SECRET: ${CALCOM_WEBHOOK_SECRET:-dev-webhook-secret-change-in-production}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres-clinic:
        condition: service_healthy
    networks:
      - citamedica-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Landing page (Astro/React)
  landing:
    build:
      context: ./apps/landing
      dockerfile: Dockerfile
    container_name: citamedica-landing
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_CALCOM_URL: http://localhost:3000
    ports:
      - "3001:3001"
    networks:
      - citamedica-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for Cal.com
  postgres-cal:
    image: postgres:16-alpine
    container_name: calcom-postgres
    environment:
      POSTGRES_DB: calcom
      POSTGRES_USER: calcom
      POSTGRES_PASSWORD: calcom123
    ports:
      - "5433:5432"
    volumes:
      - postgres-cal-data:/var/lib/postgresql/data
    networks:
      - citamedica-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calcom"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cal.com self-hosted
  calcom:
    image: calcom/cal.com:latest
    platform: linux/amd64
    container_name: citamedica-calcom
    environment:
      DATABASE_URL: postgresql://calcom:calcom123@postgres-cal:5432/calcom
      DATABASE_DIRECT_URL: postgresql://calcom:calcom123@postgres-cal:5432/calcom
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-to-a-random-string-in-production}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY:-change-this-to-a-32-char-random-string}
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
      NEXT_PUBLIC_API_V2_URL: http://localhost:3000/api/v2
      # Webhook configuration
      WEBHOOK_SECRET: ${CALCOM_WEBHOOK_SECRET:-dev-webhook-secret-change-in-production}
      # Force migrations and skip validation
      SKIP_DB_MIGRATION: "false"
      SKIP_ENV_VALIDATION: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres-cal:
        condition: service_healthy
    networks:
      - citamedica-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  postgres-clinic-data:
    driver: local
  postgres-cal-data:
    driver: local

networks:
  citamedica-network:
    driver: bridge